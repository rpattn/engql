version: '3.8'
services:
  db:
    image: 'postgres:15-alpine'
    restart: always
    environment:
      POSTGRES_USER: '${DB_USER}'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
      POSTGRES_DB: '${DB_NAME}'
    volumes:
      - 'engql_db_data:/var/lib/postgresql/data'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: '${DB_USER}'
      DB_PASSWORD: '${DB_PASSWORD}'
      DB_NAME: '${DB_NAME}'
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '8080'
    # These labels tell Coolify/Traefik to route domain.com/api to this container
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-router.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - 'traefik.http.routers.api-router.priority=100'
      - "traefik.http.routers.api-router.service=api-service"
      - "traefik.http.services.api-service.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.api-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.api-router.middlewares=api-strip"

  web:
    build:
      context: ./engql_frontend
      dockerfile: Dockerfile
      args:
        # IMPORTANT: Point this to the subpath, not a full URL
        VITE_API_URL: '/api'
    restart: always
    depends_on:
      - api
    expose:
      - '3000'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-router.rule=Host(`${DOMAIN}`) && !PathPrefix(`/api`)"
      - "traefik.http.services.web-service.loadbalancer.server.port=3000"

volumes:
  engql_db_data:
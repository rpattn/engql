version: '3.8'
services:
  db:
    image: 'postgres:15-alpine'
    restart: always
    environment:
      POSTGRES_USER: '${DB_USER}'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
      POSTGRES_DB: '${DB_NAME}'
    volumes:
      - 'engql_db_data:/var/lib/postgresql/data'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: '${DB_USER}'
      DB_PASSWORD: '${DB_PASSWORD}'
      DB_NAME: '${DB_NAME}'
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '8080'
    # These labels tell Coolify/Traefik to route domain.com/api to this container
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.engql-api.rule=Host(`engql.rpattn.co.uk`) && PathPrefix(`/api`)"
      - "traefik.http.routers.engql-api.entrypoints=websecure"
      - "traefik.http.routers.engql-api.tls=true"
      - "traefik.http.routers.engql-api.priority=100" # High priority
      - "traefik.http.routers.engql-api.middlewares=api-strip"
      - "traefik.http.middlewares.api-strip.stripprefix.prefixes=/api"
      - "traefik.http.services.engql-api-svc.loadbalancer.server.port=8080"

  web:
    build:
      context: ./engql_frontend
      dockerfile: Dockerfile
      args:
        # IMPORTANT: Point this to the subpath, not a full URL
        VITE_API_URL: '/api'
    restart: always
    depends_on:
      - api
    expose:
      - '3000'
    labels:
      - "traefik.enable=true"
      # This rule says: Handle this host, BUT ONLY if it DOES NOT start with /api
      - "traefik.http.routers.engql-web.rule=Host(`engql.rpattn.co.uk`) && !PathPrefix(`/api`)"
      - "traefik.http.routers.engql-web.entrypoints=websecure"
      - "traefik.http.routers.engql-web.tls=true"
      - "traefik.http.routers.engql-web.priority=10" # Lower priority
      - "traefik.http.services.engql-web-svc.loadbalancer.server.port=3000"
volumes:
  engql_db_data: